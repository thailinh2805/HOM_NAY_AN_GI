<title>Ăn Gì Quanh Làng</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: dải tiêu đề + ô tìm kiếm lớn, thanh bộ lọc gọn, lưới thẻ quán; thanh giá là "thước 30k–200k" */
:root{
  --bg:#F2F5EE; --surface:#FFFFFF; --ink:#17221A; --muted:#5B685D; --line:#D9E0D3;
  --accent:#E0A012; --accent-ink:#2E2100; --accent-soft:#FBEFC9; --good:#2D7448; --warn:#9A5B14;
  --display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#19211B; --ink:#E7ECE4; --muted:#9BA89D; --line:#2B362E;
  --accent:#F0B53A; --accent-ink:#241A00; --accent-soft:#3A2F12; --good:#6CC08B; --warn:#E3A55A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#19211B; --ink:#E7ECE4; --muted:#9BA89D; --line:#2B362E;
  --accent:#F0B53A; --accent-ink:#241A00; --accent-soft:#3A2F12; --good:#6CC08B; --warn:#E3A55A; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:28px 18px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(30px,6vw,48px)/1.05 var(--display);margin:6px 0 8px;text-wrap:balance;letter-spacing:-.01em}
h1 em{font-style:normal;white-space:nowrap;background:linear-gradient(transparent 74%,var(--accent) 74%);padding:0 2px}
.sub{color:var(--muted);margin:0;max-width:62ch}
.searchbar{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.searchbar label.q{flex:1 1 200px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:0 14px;min-width:0}
.searchbar label.q:focus-within{border-color:var(--accent)}
.searchbar svg{flex:none;color:var(--muted)}
#q{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 16px var(--body);padding:14px 0;outline:none}
button,select,input{font:inherit;color:inherit}
.btn{border:0;border-radius:var(--r);padding:0 18px;min-height:50px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(1.05)}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px}
.f{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.f > span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.f > span b{color:var(--ink);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.dual{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted)}
select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip small{color:var(--muted);font-weight:500;margin-left:4px}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 12px}
.status p{margin:0;font-weight:600}
.status .reset{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;padding:4px}
.pick{border:2px solid var(--accent);background:var(--accent-soft);border-radius:16px;padding:16px;margin-bottom:18px}
.pick h2{font:800 14px var(--body);letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.pick h2 button{background:none;border:0;cursor:pointer;color:var(--muted);font:600 13px var(--body);text-transform:none;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pick .card{border-color:transparent}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px}
.cat{font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-size:11.5px}
.rate{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rate i{font-style:normal;color:var(--accent)}
.rate small{color:var(--muted);font-weight:500}
.card h3{font:700 20px/1.2 var(--display);margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:13.5px;margin:0}
.price{display:flex;align-items:center;gap:10px}
.price b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.price b small{font-weight:500;color:var(--muted);font-size:13px}
.ruler{flex:1;height:6px;border-radius:3px;background:var(--line);position:relative;min-width:60px}
.ruler span{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.dist{display:inline-flex;align-self:flex-start;gap:6px;align-items:center;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg);font-variant-numeric:tabular-nums}
.dist.near{color:var(--good)}
.hl{margin:0;font-size:14px}
.note{margin:0;font-size:13px;color:var(--warn)}
.foot{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.foot .ph{user-select:all;color:var(--ink);font-variant-numeric:tabular-nums}
.foot a{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:2px solid var(--accent)}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
footer{color:var(--muted);font-size:12.5px;padding-block:0 32px}
@media (max-width:620px){.filters{grid-template-columns:1fr 1fr;gap:10px}.f{padding:10px 12px}.filters>.f:first-child,.filters>.f:last-child{grid-column:1/-1}.filters>.f:last-child{flex-direction:row}.btn{padding:0 14px}}
#geoMsg{font-size:12px;color:var(--warn);margin:0}
@media (prefers-reduced-motion:no-preference){.pick{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.98)}to{transform:none}}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Làng Đại học · Đông Hòa, Dĩ An</div>
    <h1>Hôm nay <em>ăn gì</em> quanh làng?</h1>
    <p class="sub">Quán được đánh giá cao trong bán kính 3 km quanh Bcons Plaza, KTX khu A và KTX khu B. Giá từ 30k đến 200k mỗi người.</p>
    <div class="searchbar" role="search">
      <label class="q" for="q">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Tìm món hoặc tên quán: lẩu bò, sushi, phở, ốc…" autocomplete="off" aria-label="Tìm món hoặc tên quán">
      </label>
      <button class="btn" id="randomBtn" type="button">🎲 Chọn giúp tôi</button>
    </div>

    <div class="filters">
      <div class="f">
        <span>Gần khu nào</span>
        <div class="seg" id="near" role="group" aria-label="Gần khu nào">
          <button type="button" data-v="all" aria-pressed="true">Cả 3 khu</button>
          <button type="button" data-v="bcons" aria-pressed="false">Bcons</button>
          <button type="button" data-v="ktxa" aria-pressed="false">KTX A</button>
          <button type="button" data-v="ktxb" aria-pressed="false">KTX B</button>
          <button type="button" data-v="me" aria-pressed="false" id="meBtn" hidden>📍 Tôi</button>
        </div>
        <p id="geoMsg" hidden></p>
      </div>
      <label class="f" for="radius">
        <span>Bán kính <b id="radiusOut">3 km</b></span>
        <input id="radius" type="range" min="0.5" max="3" step="0.5" value="3">
      </label>
      <div class="f">
        <span>Giá mỗi người <b id="priceOut">30k – 200k</b></span>
        <div class="dual">
          <label for="pmin">Từ</label><input id="pmin" type="range" min="30" max="200" step="10" value="30">
          <label for="pmax">Đến</label><input id="pmax" type="range" min="30" max="200" step="10" value="200">
        </div>
      </div>
      <div class="f">
        <span>Đánh giá & sắp xếp</span>
        <select id="rating" aria-label="Đánh giá tối thiểu">
          <option value="0">Mọi mức đánh giá</option>
          <option value="4.3">Từ 4.3 ★</option>
          <option value="4.5">Từ 4.5 ★</option>
          <option value="4.8">Từ 4.8 ★</option>
        </select>
        <select id="sort" aria-label="Sắp xếp">
          <option value="goi-y">Đề xuất (ngon + gần)</option>
          <option value="gan-nhat">Gần nhất</option>
          <option value="re-nhat">Rẻ nhất</option>
          <option value="rating">Đánh giá cao nhất</option>
        </select>
      </div>
    </div>
    <div class="chips" id="cats" role="group" aria-label="Loại món"></div>
  </header>

  <main>
    <div class="status">
      <p id="count" aria-live="polite">Đang tải…</p>
      <button class="reset" id="reset" type="button">Xóa bộ lọc</button>
    </div>
    <section class="pick" id="pick" hidden aria-live="polite">
      <h2><span>Gợi ý cho bạn</span><button type="button" id="closePick">Đóng ✕</button></h2>
      <div id="pickCard"></div>
    </section>
    <div class="grid" id="grid"></div>
  </main>

  <footer id="foot"></footer>
</div>

<script>
const DATA = /*__DATA__*/null;
const API_MODE = /*__API_MODE__*/false;
const FLOOR = 30, CEIL = 200;
const CATS = ["Món Việt & cơm","Lẩu & nướng","Ốc & hải sản","Hàn · Nhật · Thái · Âu","Chay"];
const $ = s => document.querySelector(s);
const defaults = {q:"", near:"all", radius:3, pmin:30, pmax:200, rating:0, sort:"goi-y", cat:""};
let state = {...defaults};
let me = null;
let lastResults = [];

try { const saved = JSON.parse(localStorage.getItem("agql-filters") || "null"); if (saved) state = {...defaults, ...saved, q:"", near: saved.near === "me" ? "all" : saved.near}; } catch (e) {}
const save = () => { try { localStorage.setItem("agql-filters", JSON.stringify(state)); } catch (e) {} };

const fold = s => (s || "").replace(/đ/g,"d").replace(/Đ/g,"D").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const hav = (a,b,c,d) => { const R=6371, r=x=>x*Math.PI/180; const dp=r(c-a), dl=r(d-b);
  const h=Math.sin(dp/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dl/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
const LM = Object.fromEntries(DATA.landmarks.map(l => [l.id, l]));

function distanceInfo(p, near){
  if (near === "me" && me) return [hav(me.lat, me.lng, p.lat, p.lng), "vị trí của bạn"];
  if (LM[near]) return [hav(LM[near].lat, LM[near].lng, p.lat, p.lng), LM[near].name];
  return DATA.landmarks.map(l => [hav(l.lat, l.lng, p.lat, p.lng), l.name]).sort((a,b) => a[0]-b[0])[0];
}

// Lọc tại trình duyệt — dùng khi trang chạy không có máy chủ Python (bản đăng online)
function localSearch(s){
  const words = fold(s.q.trim()).split(/\s+/).filter(Boolean);
  const out = [];
  for (const p of DATA.places){
    if (words.length){ const hay = fold([p.name,p.type,p.category,p.address,p.highlight].join(" ")); if (!words.every(w => hay.includes(w))) continue; }
    if (p.price_max < s.pmin || p.price_min > s.pmax) continue;
    if (s.cat && p.category !== s.cat) continue;
    if (p.rating < s.rating) continue;
    const [d, ref] = distanceInfo(p, s.near);
    if (d > s.radius) continue;
    out.push({...p, distance_km: Math.round(d*100)/100, distance_from: ref, _s: p.rating*Math.log10(p.reviews+10) - 0.35*d});
  }
  const keys = {"gan-nhat":(a,b)=>a.distance_km-b.distance_km, "re-nhat":(a,b)=>a.price_min-b.price_min||a.price_max-b.price_max,
    "rating":(a,b)=>b.rating-a.rating||b.reviews-a.reviews, "goi-y":(a,b)=>b._s-a._s};
  return out.sort(keys[s.sort] || keys["goi-y"]);
}

async function search(s){
  if (!API_MODE) return localSearch(s);
  const params = new URLSearchParams({q:s.q, near:s.near, radius:s.radius, min:s.pmin, max:s.pmax, rating:s.rating, sort:s.sort, cat:s.cat});
  if (s.near === "me" && me){ params.set("lat", me.lat); params.set("lng", me.lng); }
  try { const r = await fetch("/api/search?" + params); return (await r.json()).results; }
  catch (e) { return localSearch(s); }
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n.toLocaleString("vi-VN");
function card(p){
  const l = (p.price_min-FLOOR)/(CEIL-FLOOR)*100, w = Math.max(4,(p.price_max-p.price_min)/(CEIL-FLOOR)*100);
  const km = p.distance_km < 1 ? Math.round(p.distance_km*1000) + " m" : p.distance_km.toFixed(1).replace(".",",") + " km";
  return `<article class="card">
    <div class="top"><span class="cat">${esc(p.category)}</span><span class="rate"><i>★</i> ${p.rating.toFixed(1)} <small>(${fmt(p.reviews)})</small></span></div>
    <h3>${esc(p.name)}</h3>
    <p class="meta">${esc(p.type)} · ${esc(p.address)}</p>
    <div class="price"><b>${p.price_min}–${p.price_max}k <small>/người</small></b><div class="ruler" title="Vị trí trên thang 30k–200k"><span style="left:${l}%;width:${w}%"></span></div></div>
    <span class="dist ${p.distance_km<=1?"near":""}">${km} · ${esc(p.distance_from)}</span>
    <p class="hl">${esc(p.highlight)}</p>
    ${p.note ? `<p class="note">Lưu ý: ${esc(p.note)}</p>` : ""}
    <div class="foot"><span>🕒 ${esc(p.hours)}${p.phone ? ` · <span class="ph">${esc(p.phone)}</span>` : ""}</span>
      <a href="${esc(p.maps)}" target="_blank" rel="noopener">Chỉ đường ↗</a></div>
  </article>`;
}

function syncControls(){
  $("#q").value = state.q;
  document.querySelectorAll("#near button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.near));
  $("#radius").value = state.radius; $("#radiusOut").textContent = String(state.radius).replace(".",",") + " km";
  $("#pmin").value = state.pmin; $("#pmax").value = state.pmax; $("#priceOut").textContent = `${state.pmin}k – ${state.pmax}k`;
  $("#rating").value = state.rating; $("#sort").value = state.sort;
  document.querySelectorAll("#cats .chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.v === state.cat));
}

let ticket = 0;
async function render(){
  syncControls(); save();
  const t = ++ticket; const res = await search(state); if (t !== ticket) return;
  lastResults = res;
  $("#count").textContent = res.length ? `${res.length} quán phù hợp` : "Không có quán nào khớp";
  $("#grid").innerHTML = res.length ? res.map(card).join("") :
    `<div class="empty">Thử nới khoảng giá, tăng bán kính hoặc bỏ bớt chữ trong ô tìm kiếm.</div>`;
}

$("#cats").innerHTML = `<button type="button" class="chip" data-v="">Tất cả<small>${DATA.places.length}</small></button>` +
  CATS.map(c => `<button type="button" class="chip" data-v="${esc(c)}">${esc(c)}<small>${DATA.places.filter(p=>p.category===c).length}</small></button>`).join("");
$("#cats").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; state.cat = b.dataset.v; render(); });

let qTimer; $("#q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; render(); }, 180); });
$("#radius").addEventListener("input", e => { state.radius = +e.target.value; render(); });
$("#pmin").addEventListener("input", e => { state.pmin = +e.target.value; if (state.pmin > state.pmax) state.pmax = state.pmin; render(); });
$("#pmax").addEventListener("input", e => { state.pmax = +e.target.value; if (state.pmax < state.pmin) state.pmin = state.pmax; render(); });
$("#rating").addEventListener("change", e => { state.rating = +e.target.value; render(); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("#reset").addEventListener("click", () => { state = {...defaults}; $("#pick").hidden = true; render(); });

$("#near").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.v !== "me"){ state.near = b.dataset.v; $("#geoMsg").hidden = true; render(); return; }
  const msg = $("#geoMsg"); msg.hidden = false; msg.textContent = "Đang lấy vị trí…";
  navigator.geolocation.getCurrentPosition(
    pos => { me = {lat: pos.coords.latitude, lng: pos.coords.longitude}; state.near = "me"; msg.hidden = true; render(); },
    () => { msg.textContent = "Không lấy được vị trí. Hãy cho phép quyền vị trí (cần mở trang bằng https hoặc localhost)."; },
    {enableHighAccuracy: true, timeout: 10000});
});
if (API_MODE && "geolocation" in navigator) $("#meBtn").hidden = false;

function showPick(){
  if (!lastResults.length){ $("#pick").hidden = false; $("#pickCard").innerHTML = `<div class="empty">Chưa có quán nào khớp bộ lọc để chọn.</div>`; return; }
  const top = lastResults.slice(0, Math.max(5, Math.ceil(lastResults.length/2)));
  const p = top[Math.floor(Math.random()*top.length)];
  $("#pickCard").innerHTML = card(p); $("#pick").hidden = false;
  $("#pick").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest"});
}
$("#randomBtn").addEventListener("click", showPick);
$("#closePick").addEventListener("click", () => { $("#pick").hidden = true; });

$("#foot").textContent = `Dữ liệu cập nhật ${DATA.updated.split("-").reverse().join("/")} · ${DATA.source}. Khoảng cách tính theo đường chim bay; đường đi thực tế thường xa hơn 20–40%.`;
render();
</script>
